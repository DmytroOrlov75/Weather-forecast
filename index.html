<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>WeatherAPI</title>
</head>
<body>
   <div class="container">
       <div class="cardInput">
        <input class="inputName" type="text" placeholder="Enter city">
        <div class="searchIcon">
        <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <button class="submitBtn">Search</button>
    </div>
    <div class="app-wrap">
       <div class="weatherImg">
        <img class="mainIcon" src="./assets/weather.svg">
       </div>
       <div class="precipitationsWeather">
        <p class="townName">New York</p>
        <p class="degreesCelsius">28°C</p>
        <p class="precipitations">Precipitations</p>
       <div class="min-maxTemp">
            <p class="max">Max:35°C</p>
            <p class="min">Min:25°C</p>
        </div>
        <div class="humidity">
        <p class="hum">Humidity:81%</p>
        <p class="pres">Pressure:1012hPa</p>
        <p class="velocity">Speed:10m/s</p>
        </div>
        <div class="todayWeather">
        <div class="dateToday">
        <p>Today</p>
        <p class="date">Mar,9</p>
        </div>
        <div class="hoursWeather">
        <div class="time_9">
            <h4>29°C</h4>
            <img src="./assets/cloudWithSun.svg" alt="rain">
            <p>15:00</p>
        </div>
            <div class="time_12">
            <h4>29°C</h4>
            <img src="./assets/cloudWithSun.svg" alt="rain">
            <p>15:00</p>
            </div>
            <div class="time_15">
            <h4>29°C</h4>
            <img src="./assets/cloudWithSun.svg" alt="rain">
            <p>15:00</p>
            </div>
            <div class="time_18">
            <h4>29°C</h4>
            <img src="./assets/cloudWithSun.svg" alt="rain">
            <p>15:00</p>
            </div>
    </div>
    </div>    
    </div>
    </div>
   </div> 
   </div>
</body>
<script src="./js/project.js"></script>
</html>
